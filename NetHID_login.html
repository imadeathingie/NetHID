<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetHID — Login</title>
<style>
  :root {
    --bg: #0d0d0f; --surface: #18181c; --surface2: #222228;
    --accent: #7c6af7; --accent2: #f76aad; --text: #e8e8f0;
    --text-dim: #6b6b80; --key-border: #35354a; --radius: 8px;
    --font: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--surface); border: 1px solid var(--key-border);
    border-radius: 14px; padding: 40px 36px; width: 320px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .logo { font-size: 1.3rem; letter-spacing: 0.15em; color: var(--accent);
    font-weight: bold; text-align: center; }
  .logo span { color: var(--accent2); }
  .sub { font-size: 0.75rem; color: var(--text-dim); text-align: center;
    letter-spacing: 0.05em; }
  input[type=password], input[type=text] {
    width: 100%; background: var(--surface2); border: 1px solid var(--key-border);
    border-radius: var(--radius); color: var(--text); font-family: var(--font);
    font-size: 0.9rem; padding: 12px; outline: none;
    transition: border-color 0.15s; letter-spacing: 0.1em;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); padding: 12px; font-family: var(--font);
    font-size: 0.9rem; cursor: pointer; letter-spacing: 0.08em;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.75; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .error {
    background: #2a1215; border: 1px solid #7f1d1d; border-radius: var(--radius);
    color: #f87171; font-size: 0.78rem; padding: 10px 12px;
    text-align: center; display: none;
  }
  .error.visible { display: block; }
  .locked { color: #fbbf24; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">NET<span>HID</span></div>
  <div class="sub" id="sub">ENTER PASSWORD TO UNLOCK</div>
  <div class="error" id="err"></div>
  <input type="text" id="user" placeholder="Username" autocomplete="username"
         class="hidden" onkeydown="if(event.key==='Enter')login()">
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password"
         autofocus onkeydown="if(event.key==='Enter')login()">
  <button class="btn" id="go" onclick="login()">UNLOCK</button>
</div>
<script>
// ── Pure-JS SHA-256 + HMAC ───────────────────────────────────────────────────
// The device is served over plain HTTP on the LAN, where window.crypto.subtle
// is unavailable (it's restricted to secure contexts), so we hash in-page.
const _K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function _sha256(bytes){
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length,bitLen=l*8,withOne=l+1,k=(56-withOne%64+64)%64,total=withOne+k+8;
  const m=new Uint8Array(total); m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer);
  dv.setUint32(total-4,bitLen>>>0,false);
  dv.setUint32(total-8,Math.floor(bitLen/0x100000000),false);
  const w=new Uint32Array(64);
  for(let off=0;off<total;off+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(off+i*4,false);
    for(let i=16;i<64;i++){
      const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
      const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+_K[i]+w[i])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const out=new Uint8Array(32),odv=new DataView(out.buffer);
  for(let i=0;i<8;i++) odv.setUint32(i*4,H[i],false);
  return out;
}
function hmacSha256Hex(keyStr,msgStr){
  const enc=new TextEncoder();
  let key=enc.encode(keyStr); const msg=enc.encode(msgStr);
  if(key.length>64) key=_sha256(key);
  const k=new Uint8Array(64); k.set(key);
  const ip=new Uint8Array(64),op=new Uint8Array(64);
  for(let i=0;i<64;i++){ ip[i]=k[i]^0x36; op[i]=k[i]^0x5c; }
  const i1=new Uint8Array(64+msg.length); i1.set(ip); i1.set(msg,64);
  const inner=_sha256(i1);
  const o1=new Uint8Array(96); o1.set(op); o1.set(inner,64);
  return Array.from(_sha256(o1),x=>x.toString(16).padStart(2,'0')).join('');
}

// ── Login flow ────────────────────────────────────────────────────────────────
let MULTIUSER = false;

(async function init(){
  try {
    const j = await (await fetch('/api/authinfo', {cache:'no-store'})).json();
    MULTIUSER = !!j.multiuser;
  } catch(e) { MULTIUSER = false; }
  if (MULTIUSER) {
    const u = document.getElementById('user');
    u.classList.remove('hidden');
    document.getElementById('sub').textContent = 'SIGN IN';
    let last = '';
    try { last = localStorage.getItem('nethid.lastuser') || ''; } catch(e) {}
    if (last) {                 // remembered name → prefill and jump to the password
      u.value = last;
      document.getElementById('pw').focus();
    } else {
      u.focus();
    }
  } else {
    document.getElementById('pw').focus();
  }
})();

function showErr(msg, cls){
  const err = document.getElementById('err');
  err.textContent = msg;
  err.className = 'error visible' + (cls ? ' ' + cls : '');
}

async function login(){
  const go = document.getElementById('go');
  const user = MULTIUSER ? document.getElementById('user').value.trim() : '';
  const pw = document.getElementById('pw').value;
  document.getElementById('err').className = 'error';
  if (MULTIUSER && !user) { showErr('Enter a username.'); return; }
  go.disabled = true;
  try {
    // 1) fetch a one-time nonce
    const cr = await fetch('/api/challenge', {cache:'no-store'});
    const cj = await cr.json();
    if (!cj.nonce) {
      showErr(cj.error === 'busy' ? 'Server busy — try again.' : 'Cannot start login.');
      go.disabled = false; return;
    }
    // 2) response = HMAC-SHA256(password, nonce)
    const response = hmacSha256Hex(pw, cj.nonce);
    // 3) authenticate (password never leaves this page)
    const r = await fetch('/api/auth', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user: user, nonce: cj.nonce, response: response})
    });
    const j = await r.json();
    if (j.ok) {
      if (MULTIUSER) { try { localStorage.setItem('nethid.lastuser', user); } catch(e) {} }
      window.location.replace('/');
      return;
    }
    if (j.error === 'locked') {
      showErr('Too many attempts. Locked for ' + j.retry_after + 's.', 'locked');
    } else {
      showErr(MULTIUSER ? 'Wrong username or password.' : 'Incorrect password.');
      document.getElementById('pw').value = '';
      document.getElementById(MULTIUSER ? 'user' : 'pw').focus();
    }
  } catch(e) {
    showErr('Connection error.');
  }
  go.disabled = false;
}
</script>
</body>
</html>
